<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board Tusk</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#315647}
  #board{width:100vw;height:100vh;display:grid;place-items:center}
  #setup{position:fixed;inset:0;display:grid;place-items:center;background:#315647;z-index:10}
  #setup[hidden]{display:none!important}
  #bt-headsup{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:20}
  #bt-headsup[hidden]{display:none!important}
</style>
</head>
<body>
<div id="board"></div>

<div id="setup">
  <div id="box-register">
    <h2>Registration</h2>
    <input id="reg-name" placeholder="name">
    <button id="btn-register">Register</button>
  </div>
  <div id="box-start" hidden>
    <h2>Start Game</h2>
    <button id="btn-begin">Begin Game</button>
  </div>
</div>

<div id="bt-headsup" hidden>
  <div>
    <h2>Game Ready</h2>
    <button id="btn-headsup-continue">Continue</button>
  </div>
</div>

<script>
(function(){
  const $ = id=>document.getElementById(id);
  let state = null;
  let pendingGameForHeadsUp = null;
  let btChannel = null;
  let saveGameToCF = async (g)=>{ /* your CF save */ };
  async function loadGame(gid){ /* your CF load */ return null; }
  function cloneRacks(g){ return JSON.parse(JSON.stringify(g)); }
  function fresh(){ return {id:'mtw'+Math.random().toString(36).slice(2), racks:[[],[]]}; }
  function render(){
    const b=$('board');
    if(!state){ b.innerHTML=''; return; }
    b.innerHTML = '<div style="color:#fff">game '+state.id+'</div>';
  }
  function renderBoxes(){
    const owner = localStorage.getItem("bt_owner");
    const br=$('box-register'), bs=$('box-start');
    if(br) br.hidden =!!owner;
    if(bs) bs.hidden =!owner;
  }
  function showHeadsUp(g){
    pendingGameForHeadsUp = g;
    $('bt-headsup').hidden=false;
  }
  function showCollabHeadsUp(g){ showHeadsUp(g); }

  async function linkGameViaInvite(iid){ return null; }

  function handleRegister(){
    const u=($('reg-name').value||'').trim();
    if(!u) return;
    localStorage.setItem("bt_owner",u);
    // make sure outer modal is visible after register
    $('setup').hidden=false;
    const iid = new URLSearchParams(location.search).get("invite");
    if(iid){
      linkGameViaInvite(iid).then(g=>{
        if(g){ showCollabHeadsUp(g); }
        else { renderBoxes(); }
      });
    } else {
      renderBoxes();
    }
  }

  async function handleBegin(){
    const g=fresh();
    pendingGameForHeadsUp=g;
    try{ await saveGameToCF(g); }catch{}
    localStorage.setItem("bt_activeGameId",g.id);
    showHeadsUp(g);
  }

  async function handleHeadsUpContinue(){
    const g=pendingGameForHeadsUp;
    if(!g) return;
    state=g;
    $('bt-headsup').hidden=true;
    $('setup').hidden=true;
    history.replaceState(null,"","?game="+g.id);
    render();
  }

  // --- poll + clear in same closure, no second script ---
  let pollId = setInterval(async()=>{
    if(cleared) return;
    try{
      let gid = state?.id || localStorage.getItem("bt_activeGameId");
      if(!gid) return;
      let freshG = await loadGame(gid);
      if(freshG && state && freshG.id===state.id){
        state = cloneRacks(freshG);
        render();
      }
    }catch{}
  },2000);

  let cleared=false;
  async function hardClear(){
    if(cleared) return;
    cleared=true;
    clearInterval(pollId);
    try{ btChannel?.close(); }catch{}
    saveGameToCF = ()=>Promise.resolve();
    let _setItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(k,v){
      if(k==="bt_owner"||k.startsWith("bt_activeGameId")||k.startsWith("bt_pending_game_")) return;
      return _setItem.call(this,k,v);
    };
    localStorage.removeItem("bt_owner");
    localStorage.removeItem("bt_activeGameId");
    localStorage.removeItem("bt_pending_game_p1");
    localStorage.removeItem("bt_pending_game_p2");
    localStorage.removeItem("bt_activeGameId_p2");
    history.replaceState(null,"",location.pathname);
    location.reload();
  }

  window.addEventListener('keydown',(e)=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
      e.preventDefault();
      hardClear();
    }
  });

  $('btn-register')?.addEventListener('click',handleRegister);
  $('btn-begin')?.addEventListener('click',handleBegin);
  $('btn-headsup-continue')?.addEventListener('click',handleHeadsUpContinue);

  (async()=>{
    const params=new URLSearchParams(location.search);
    let hasState=false;
    let gid=params.get("game");
    if(gid){
      let g=await loadGame(gid);
      if(g){ state=g; hasState=true; }
    }
    if(hasState){
      $('setup').hidden=true;
      render();
    } else {
      $('setup').hidden=false;
      renderBoxes();
      render();
    }
  })();
}());
</script>
</body>
</html>
