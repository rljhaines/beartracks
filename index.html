<style>
:root{--ink:#23392f;--paper:#f6f0e4;--tile:#f8e5af;--line:#d7cfbd;--green:#28604b;--orange:#d66f42;--muted:#65756b;--gap:2px;--pad:4px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game,.wrap{width:100vw;height:100dvh;display:flex;flex-direction:column;max-width:1300px;margin:auto;padding:16px 22px 16px;box-sizing:border-box}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:8px;flex:0 0 auto}.brand{font-size:29px;font-weight:800;letter-spacing:-1.2px}.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);margin-top:3px}.turn-pill{background:#e5eee7;border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;flex:1;min-height:0;align-items:start}.left-col{display:flex;flex-direction:column;gap:0;min-height:0;flex:1}
.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:var(--gap);padding:var(--pad);background:#315647;border-radius:9px;aspect-ratio:1/1;width:100%;flex:1;min-height:0;max-width:min(100vw, 100dvh - 160px);margin:auto;box-sizing:border-box}
.cell{border:0;min-width:0;padding:0;position:relative;background:#e7d9bd;color:#274336;cursor:pointer;aspect-ratio:1}.cell:focus{outline:3px solid var(--orange);z-index:2}.cell.anchor{outline:3px solid var(--orange);z-index:2}
.premium{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:800;line-height:1.05}.tw{background:#cf7c6f;color:white}.dw{background:#e6aaa2}.tl{background:#5c99aa;color:white}.dl{background:#a8cbd0}
.tile{position:absolute;inset:3px;background:var(--tile);border-radius:4px;box-shadow:0 1px 2px #8d7548;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.1vw,26px);font-weight:900;color:#25291e}.tile b{position:absolute;right:3px;bottom:1px;font-size:9px}.tile.blank:after{content:"•";font-size:10px;position:absolute;top:1px;left:4px}.tile.ghost{opacity:0.55;border:2px dashed var(--orange);background:#f8e5afcc}
.below-board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:var(--gap);margin-top:8px;width:100%;padding:0 var(--pad);box-sizing:border-box;align-items:stretch;flex:0 0 auto}
.rack{grid-column:1 / 8;grid-row:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--gap);width:100%;box-sizing:border-box}.rack-tile{aspect-ratio:1;width:100%;border:0;border-radius:4px;background:var(--tile);box-shadow:0 1px 2px #8d7548;position:relative;font-size:clamp(13px,2.1vw,26px);font-weight:900;color:#25291e;cursor:pointer;display:flex;align-items:center;justify-content:center}.rack-tile small{position:absolute;right:3px;bottom:1px;font-size:9px}.rack-tile.selected{outline:3px solid var(--orange);transform:translateY(-2px);z-index:1}
.entry-row{grid-column:1 / 8;grid-row:2;display:flex;gap:6px;align-items:center;height:44px;width:100%}.entry-row input{flex:1 1 0;min-width:0;height:44px;border:1px solid #b7bcad;border-radius:8px;padding:0 10px;font:inherit;text-transform:uppercase}.entry-row input::placeholder{text-transform:none;font-style:italic;font-size:12px}.entry-row button{height:44px;flex:0 0 auto;padding:0 14px;white-space:nowrap;border:0;border-radius:8px;font-weight:800;cursor:pointer}#shuffle{background:#e4dfd3;color:var(--ink)}#playWord{background:var(--green);color:white}
.gameplay-box{grid-column:9 / 16;grid-row:1;align-self:stretch;min-height:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 2px 7px #362c1711}.placement{font-size:11px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}.status{font-size:11px;color:var(--ink);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.status.prompt{font-size:14px;font-style:normal;color:#c0392b;white-space:normal;font-weight:700;text-shadow:0 0 0.5px currentColor;animation:btBreathe 3.1s ease-in-out infinite}@keyframes btBreathe{0%{opacity:1}50%{opacity:0.62}100%{opacity:1}}
.actions-row{display:flex;gap:6px;align-items:stretch;height:44px;grid-column:9 / 16;grid-row:2;align-self:stretch;margin-top:0;box-sizing:border-box}.actions-row.action{height:44px;align-self:stretch;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}.card{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 7px #362c1711}.card h2{font-size:12px;letter-spacing:.8px;margin:0 0 9px;color:#426050}.action{border:0;border-radius:9px;padding:11px 7px;font-weight:800;background:var(--green);color:white;cursor:pointer}.action:disabled{opacity:.5}.action.alt{background:#e4dfd3;color:var(--ink)}.scores{display:grid;gap:8px}.score{padding-left:9px;border-left:4px solid #cbd4c9;display:flex;justify-content:space-between}.score.active{border-color:var(--orange)}.history{margin:0;padding-left:18px;max-height:180px;overflow:auto;font-size:12px}.history li{margin:5px 0}.help{font-size:12px;line-height:1.4;color:#526359}
.modal{position:fixed;inset:0;background:#17342899;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal[hidden]{display:none}.dialog{width:min(460px,100%);background:#fffdf8;border-radius:15px;padding:23px;box-shadow:0 18px 55px #0008}.dialog h1{margin:0 0 8px}.dialog p{color:#526359;line-height:1.4}.dialog label{display:block;font-weight:700;margin:13px 0}.dialog input{display:block;width:100%;margin-top:5px;border:1px solid #b7bcad;border-radius:8px;padding:9px;font:inherit}.dialog input::placeholder{color:#9aa89e;font-style:italic}.dialog button{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 14px;font-weight:800;cursor:pointer;margin-top:8px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.below-board{padding:0}}.start-game-box{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:#fffdf8}.error{color:#a12a2a;font-size:12px;min-height:16px;margin-top:6px}#invite-copy{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#bt-headsup{position:fixed;top:6%;left:50%;transform:translateX(-50%);width:min(680px,58vw);z-index:20}#bt-headsup[hidden]{display:none}#bt-headsup-box{display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:start;background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 12px 40px #00000033}#bt-headsup-left{display:flex;flex-direction:column;gap:8px;min-width:0}#bt-headsup-help{font-size:13px;line-height:1.3;color:var(--ink);font-weight:600}#bt-headsup-input{width:100%;border:1px solid #b7bcad;border-radius:8px;padding:9px 10px;font:12px/1.3 ui-monospace,Menlo,monospace;background:#fefaf0;color:var(--ink);word-break:break-all;resize:none;height:58px}#bt-headsup-right{display:flex;flex-direction:column;gap:8px}#bt-headsup-right button{height:38px;border:0;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;padding:0 12px;white-space:nowrap}#bt-headsup-right button:disabled{opacity:1;background:#e2ddd1;color:#8a857a;cursor:default}#bt-headsup-copy-msg{background:#e2ddd1}#bt-headsup-copy-link{background:var(--green);color:white}#bt-headsup-continue{background:#23392f;color:white;margin-top:4px}@media(max-width:700px){#bt-headsup{width:92vw;top:3%}#bt-headsup-box{grid-template-columns:1fr;gap:10px}#bt-headsup-right{flex-direction:row;flex-wrap:wrap}#bt-headsup-right button{flex:1 1 140px}}
</style>
</head>
<body>
<main class="wrap" id="game">
<header class="mast"><div class="brand">BearTracks<small>Destination unknown, but we'll get there together.</small></div><div class="turn-pill" id="turnPill"></div></header>
<div class="layout"><section class="left-col"><div class="board" id="board"></div><div class="below-board"><div class="rack" id="rack"></div><div class="entry-row"><input id="wordInput" maxlength="30" placeholder="Type word or word 8,8,0"><button class="action alt" id="shuffle">Shuffle</button><button class="action" id="playWord">Play</button></div><div class="gameplay-box" id="gameplayBox"><div class="placement" id="placement"></div><div class="status" id="status"></div></div><div class="actions-row"><button class="action" id="submitWord">Submit Word</button><button class="action alt" id="undo">Undo</button><button class="action alt" id="pass">Pass</button></div></div></section><aside class="side"><section class="card" id="share-panel" hidden><h2>Share</h2><div class="help" id="share-help"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="share-url" readonly style="flex:1;border:1px solid #b7bcad;border-radius:8px;padding:8px"><button id="share-copy" class="action alt">Copy</button></div></section><section class="card"><h2>Scoreboard</h2><div class="scores" id="scores"></div><p class="help" id="bag"></p></section><section class="card"><h2>Moves</h2><ol class="history" id="history"></ol><button class="action alt" id="help" style="margin-top:10px;width:100%">How this works</button></section></aside></div>
</main>
<div class="modal" id="setup"><section class="dialog">
<div id="box-register" class="start-game-box"><h1>BearTracks Registration</h1><p>Register to play.</p><label>Username<input id="reg-user" placeholder="Username" autofocus autocomplete="username"></label><label>Password<input id="reg-pass" type="password"></label><label>Confirm password<input id="reg-pass2" type="password"></label><button id="btn-register">Register</button><div id="reg-error" class="error"></div></div>
<div id="box-start" class="start-game-box" hidden><h1>Start a game</h1><div><strong id="owner-name"></strong></div><label>Opponent's name (optional)<input id="nameB" maxlength="28" placeholder="Opponent username"></label><div style="display:flex;gap:8px;margin-top:10px"><button id="btn-begin">Begin Game</button><button id="btn-invite" class="action alt">Create Invitation</button></div><div id="invite-copy" hidden><div class="help">Join me in a scrabble-like game on BearTracks:</div><div style="display:flex;gap:6px"><input id="invite-url" readonly><button id="btn-copy">Copy</button></div></div><button id="btn-logout" class="action alt" style="margin-top:12px">Log out</button></div>
</section></div>
<div id="bt-headsup" hidden><div id="bt-headsup-box"><div id="bt-headsup-left"><div id="bt-headsup-help">Join me in a scrabble-like game on BearTracks:</div><textarea id="bt-headsup-input" readonly></textarea></div><div id="bt-headsup-right"><button id="bt-headsup-copy-msg" disabled>Message copied</button><button id="bt-headsup-copy-link">Copy link instead</button><button id="bt-headsup-continue">Continue to game</button></div></div></div>
<script id="game-state" type="application/json">null</script>

var state=null,pending=[],selected=-1,anchor=null,dragItem=null,gesture=null,suppressClick=false,waiting=false,waitingRack=null,waitingOpp=null,pendingWord=null,liveGhosts=[];
const API="https://tracker-api.beartracksgames.workers.dev";const LIVE_SITE="https://rljhaines.github.io/beartracks/";

function getLocalIdx(){
  let owner=(getOwner()||"").toLowerCase();
  if(!state) return 0;
  for(let i=0;i<state.players.length;i++){
    if((state.players[i].name||"").toLowerCase()===owner) return i;
  }
  return 1; // opponent not yet claimed -> show opponent rack (index 1) as fallback
}
function getLocalRack(){ if(!state) return []; return state.players[getLocalIdx()].rack; }

  var rh=''; var remaining=Object.assign({},used);

function promoteLiveToPending(){
  if(!liveGhosts.length)return false;
  var word=$('wordInput').value.toUpperCase().replace(/[^A-Z]/g,'');if(!word)return false;
  var dr=anchor.d==='V'?1:0,dc=anchor.d==='H'?1:0;
  var lr=getLocalRack();

    var r=anchor.r+i*dr,c=anchor.c+i*dc;if(r<0||r>=N||c<0||c>=N)continue;
    if(state.board[r][c])continue;
    var L=word.charAt(i);var at=lr.findIndex(function(x){return x.l===L});if(at<0)at=lr.findIndex(function(x){return x.l==='?'});if(at<0)continue;
    var q=lr.splice(at,1)[0];if(q.l==='?')q={l:L,blank:true};state.board[r][c]=q;pending.push({r:r,c:c,tile:q});
  }

}

}

  if(selected<0){anchor={r:r,c:c,d:'H'};render();if(!$('wordInput').value.trim()){$('placement').textContent='Starts at '+String.fromCharCode(65+c)+(r+1)+' across — type your word';message('Type your word — letters will appear on board as you type',true);}return;}

  if(q.l==='?'){
    var z=prompt('Blank = a-z');z=(z||'').trim().toUpperCase();
    if(!/^[A-Z]$/.test(z)){getLocalRack().push(q);message('Blank cancelled.');return false;}
    q={l:z,blank:true}
  }
  state.board[r][c]=q;pending.push({r:r,c:c,tile:q});return true
}
function placeWordAtAnchor(word){

      if(state.board[r][c]){if(state.board[r][c].l!==word.charAt(i)){ok=false;last='Conflict at '+(r+1)+','+(c+1)+' has '+state.board[r][c].l+' vs '+word.charAt(i);break;}}

function parseEntry(raw){if(!raw)return{word:'',nums:[]};var letters=(raw.match(/[A-Za-z]+/g)||[]).join('');var word=letters.toUpperCase();var numMatches=raw.match(/\d+/g)||[];var nums=numMatches.map(function(n){return parseInt(n,10);});return{word:word,nums:nums};}
function playTyped(){if(waiting)return;let li=getLocalIdx(); if(state.turn!==li) return;if(liveGhosts.length){promoteLiveToPending();return;}var raw=$('wordInput').value.trim();if(!raw){message('Type a word first.');return;}var parsed=parseEntry(raw);var word=parsed.word;var nums=parsed.nums;if(!word){message('Type a word first.');return;}if(nums.length>=2){var rr=nums[0],cc=nums[1],dir=nums.length>=3?nums[2]:0;if(rr<1||rr>15||cc<1||cc>15){message('Rows and cols 1-15. 1,1 is top-left.');return;}if(dir!==0&&dir!==1){message('Direction 0=across, 1=down.');return;}anchor={r:rr-1,c:cc-1,d:dir===1?'V':'H'};placeWordAtAnchor(word);}else{if(anchor){placeWordAtAnchor(word);}else{pendingWord=word;message('select a starting square with a click or double-click',true);$('placement').textContent='Word: '+word+' — click for across, double-click for down';}}}

function snapshotForRollback(){return{board:JSON.parse(JSON.stringify(state.board)),players:JSON.parse(JSON.stringify(state.players)),bag:state.bag.slice(),history:state.history.slice(),moveCount:state.moveCount,turn:state.turn};}
function showShare(url){let sp=$('share-panel'),su=$('share-url'),sh=$('share-help');if(sp&&su){su.value=url;sp.hidden=false;if(sh)sh.textContent='Join me in a scrabble-like game on BearTracks:';}let iu=$('invite-url'),ic=$('invite-copy');if(iu)iu.value=url;if(ic)ic.hidden=false;}
async function copyLink(gs){if(!currentInvite){let iid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);currentInvite={id:iid};let owner=getOwner()||"player";let inv={id:iid,invitedBy:owner,invitedByOpponents:getOpponents(),gameId:gs.id,mode:"game-invite",created:Date.now()};await saveInviteToCF(inv);await saveGameToCF(gs);}else{await saveGameToCF(gs);}let url=makeInviteUrl(currentInvite.id);let full="Join me in a scrabble-like game on BearTracks: "+url;if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(full);}catch(e){}}showShare(url);return url;}
function b64DecodeUnicode(b64){try{b64=b64.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');while(b64.length%4)b64+='=';const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}catch(e){return null;}}
function tryLoadFromHash(){var h=location.hash||'';if(h.indexOf('#s=')===0){try{var b64=decodeURIComponent(h.slice(3));var txt=b64DecodeUnicode(b64);if(!txt)return null;var gs=JSON.parse(txt);if(gs)return gs;}catch(e){}}try{var q=new URLSearchParams(location.search);var qs=q.get('s');if(qs){var txt2=b64DecodeUnicode(decodeURIComponent(qs));if(!txt2)return null;var gs2=JSON.parse(txt2);if(gs2)return gs2;}}catch(e){}return null;}
async function commit(){
  try{
    let li=getLocalIdx(); if(state.turn!==li) throw Error("Not your turn");
    if(liveGhosts.length)promoteLiveToPending();
    var words=validate(),pts=0,nms=[];
    for(var i=0;i<words.length;i++){pts+=score(words[i]);nms.push(words[i].map(function(x){return x.t.l}).join(''));}
    if(pending.length===7)pts+=50;
    state.undoStack=state.undoStack||[];if(state.undoStack.length>0)state.undoStack.shift();
    state.undoStack.push(snapshotForRollback());
    var myIdx=li;var p=state.players[myIdx];p.score+=pts;state.history.push(p.name+': '+nms.join(' + ')+' for '+pts);
    state.moveCount=(state.moveCount||0)+1;draw(state,p);pending=[];anchor=null;pendingWord=null;
    var myRack=p.rack.slice();var oppName=state.players[1-myIdx].name;state.turn=1-state.turn;
    try{await fetch(API+"/games/"+state.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:state})});}catch(e){}
    await copyLink(state);
    $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+(i===state.turn?' - turn':'')+'</span><strong>'+x.score+'</strong></div>'}).join('');
    $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
    $('bag').textContent=state.bag.length+' tiles remain.';
    enterWaitingMode(myRack,oppName,false);
  }catch(e){message(e.message);}
}
function pass(){
  let li=getLocalIdx(); if(state.turn!==li) return message('Not your turn');
  if(pending.length||liveGhosts.length)return message('Undo unplayed tiles before passing.');
  var myIdx=li;var myRackPass=state.players[myIdx].rack.slice();var oppName=state.players[1-myIdx].name;var p=state.players[myIdx];
  state.undoStack=state.undoStack||[];if(state.undoStack.length>3)state.undoStack.shift();state.undoStack.push(snapshotForRollback());
  if(state.moveCount===0){
    if(confirm('Allow '+oppName+' to play the first word?')){
      state.history.push(p.name+' passed - '+oppName+' to start');state.moveCount=1;state.turn=1-state.turn;
      fetch(API+"/games/"+state.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:state})}).catch(()=>{});
      copyLink(state).then(()=>{});
      $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+'</span><strong>'+x.score+'</strong></div>'}).join('');
      $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
      $('bag').textContent=state.bag.length+' tiles remain.';enterWaitingMode(myRackPass,oppName,true);
    }return;
  }
  state.history.push(p.name+' passed');draw(state,p);state.moveCount=(state.moveCount||0)+1;state.turn=1-state.turn;anchor=null;
  fetch(API+"/games/"+state.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:state})}).catch(()=>{});
  copyLink(state).then(()=>{});
  $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+'</span><strong>'+x.score+'</strong></div>'}).join('');
  $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
  $('bag').textContent=state.bag.length+' tiles remain.';enterWaitingMode(myRackPass,oppName,true);
}
async function linkGameViaInvite(inviteId,newUsername){let inv=null;for(let a=0;a<5;a++){inv=await loadInvite(inviteId);if(inv)break;await new Promise(r=>setTimeout(r,500));}if(!inv)return null;if(inv.gameId){for(let a=0;a<5;a++){let g=await loadGame(inv.gameId);if(g){let p1=(g.players[1].name||"").toLowerCase();if(p1==="opponent"||p1===""||p1===newUsername.toLowerCase()){g.players[1].name=newUsername;try{await fetch(API+"/games/"+g.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});}catch(e){}}addOpponent(g.players[0].name);addOpponent(g.players[1].name);addGameId(g.id);return g;}await new Promise(r=>setTimeout(r,400));}}let fb=fresh(inv.invitedBy||"pooh",newUsername);try{await saveGameToCF(fb);inv.gameId=fb.id;inv.mode="game-invite";await saveInviteToCF(inv);}catch(e){}addOpponent(inv.invitedBy||"pooh");addGameId(fb.id);return fb;}
async function handleRegister(){
  let uEl=$('reg-user'),pEl=$('reg-pass'),p2El=$('reg-pass2'),errEl=$('reg-error');
  let u=uEl?uEl.value.trim():'',p=pEl?pEl.value:'',p2=p2El?p2El.value:'';
  if(errEl)errEl.textContent='';if(!u||!p){if(errEl)errEl.textContent='Fill username and password';return;}
  if(p!==p2){if(errEl)errEl.textContent='Passwords do not match';return;}
  let users=[];try{users=JSON.parse(localStorage.getItem("bt_users")||"[]")}catch(e){users=[]}
  if(users.some(x=>x.toLowerCase()===u.toLowerCase())){if(errEl)errEl.textContent='Username taken';return;}
  localStorage.setItem("bt_owner",u);try{localStorage.removeItem("bt_pass_"+u.toLowerCase());}catch(e){}
  users.push(u);localStorage.setItem("bt_users",JSON.stringify(users));
  let inviteParam=null;try{inviteParam=new URLSearchParams(location.search).get("invite");}catch(e){}
  if(inviteParam){
    try{
      let g=await linkGameViaInvite(inviteParam,u);
      if(g){state=g;$('setup').hidden=true;try{let url=new URL(location.href);url.searchParams.delete('invite');history.replaceState(null,'',url.pathname+url.search);}catch(e){}currentInvite=null;render();return;}
      else{if(errEl)errEl.textContent="Invite not found, starting fresh";}
    }catch(e){if(errEl)errEl.textContent="Invite link failed: "+e.message;await new Promise(r=>setTimeout(r,800));}
  }
  let ids=getAllGameIds();
  for(let i=ids.length-1;i>=0;i--){
    let g=await loadGame(ids[i]);if(!g)continue;
    if((g.players[1].name||"").toLowerCase()==="opponent"||(g.players[1].name||"").toLowerCase()===""){g.players[1].name=u;try{await fetch(API+"/games/"+g.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});}catch(e){}addOpponent(g.players[0].name);state=g;$('setup').hidden=true;render();return;}
    if((g.players[1].name||"").toLowerCase()===u.toLowerCase()||(g.players[0].name||"").toLowerCase()===u.toLowerCase()){state=g;$('setup').hidden=true;render();return;}
  }
  renderBoxes();
}
let pendingGameForHeadsUp=null;let headsupData={url:"",msg:""};let headsupMode="msg";
async function showHeadsUp(inviteId,gameObj){let url=makeInviteUrl(inviteId);let fullMsg="Join me in a scrabble-like game on BearTracks: "+url;headsupData.url=url;headsupData.msg=fullMsg;headsupMode="msg";let input=$('bt-headsup-input');if(input)input.value=fullMsg;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(fullMsg);}}catch(e){}let btnMsg=$('bt-headsup-copy-msg');if(btnMsg){btnMsg.disabled=true;btnMsg.textContent="Message copied";}let btnLink=$('bt-headsup-copy-link');if(btnLink){btnLink.disabled=false;btnLink.textContent="Copy link instead";}$('bt-headsup').hidden=false;pendingGameForHeadsUp=gameObj;showShare(url);}
function handleHeadsUpCopyMsg(){if(headsupMode==="msg")return;headsupMode="msg";$('bt-headsup-input').value=headsupData.msg;try{navigator.clipboard.writeText(headsupData.msg).catch(()=>{});}catch(e){}$('bt-headsup-copy-msg').disabled=true;$('bt-headsup-copy-msg').textContent="Message copied";$('bt-headsup-copy-link').disabled=false;$('bt-headsup-copy-link').textContent="Copy link instead";}
function handleHeadsUpCopyLink(){if(headsupMode==="link")return;headsupMode="link";$('bt-headsup-input').value=headsupData.url;try{navigator.clipboard.writeText(headsupData.url).catch(()=>{});}catch(e){}$('bt-headsup-copy-link').disabled=true;$('bt-headsup-copy-link').textContent="Link copied";$('bt-headsup-copy-msg').disabled=false;$('bt-headsup-copy-msg').textContent="Copy message instead";}
function handleHeadsUpContinue(){$('bt-headsup').hidden=true;if(pendingGameForHeadsUp){let g=pendingGameForHeadsUp;let opp=($('nameB')?$('nameB').value.trim():'');let iid=currentInvite?currentInvite.id:null;state=g;$('setup').hidden=true;render();let url=iid?makeInviteUrl(iid):makeInviteUrl("temp");if(opp){message(`Game with ${opp} started. Share this link to send game-state to ${opp}: ${url}`, true);}else{message(`Game started as invitation-with-board. Share this link to invite an opponent: ${url}`, true);}pendingGameForHeadsUp=null;}}
async function handleBegin(){let owner=getOwner();if(!owner){renderBoxes();return;}let opp=($('nameB')?$('nameB').value.trim():'');let g=fresh(owner,opp||"Opponent");let iid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);currentInvite={id:iid,invitedBy:owner,invitedByOpponents:getOpponents(),gameId:g.id,mode:"game-invite",created:Date.now()};try{await saveGameToCF(g);await saveInviteToCF(currentInvite);}catch(e){let errEl=$('reg-error');if(errEl)errEl.textContent="Save failed: "+e.message;console.error(e);return;}if(opp)addOpponent(opp);await showHeadsUp(iid,g);}
async function handleCreateInvitation(){let owner=getOwner();if(!owner){renderBoxes();return;}let id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);let placeholder=fresh(owner,"Opponent");try{await saveGameToCF(placeholder);let inv={id:id,invitedBy:owner,invitedByOpponents:getOpponents(),gameId:placeholder.id,mode:"unregistered-invite",created:Date.now()};await saveInviteToCF(inv);currentInvite=inv;}catch(e){console.error(e);alert("Save failed: "+e.message);return;}await showHeadsUp(id,placeholder);}
function fit(){var vv=window.visualViewport;var w=vv?vv.width:window.innerWidth;var h=vv?vv.height:window.innerHeight;var mast=document.querySelector('.mast')?.offsetHeight||50;var below=document.querySelector('.below-board')?.offsetHeight||96;var availH=h-mast-below-32;var leftColW=document.querySelector('.left-col')?.clientWidth||w;var size=Math.min(leftColW,availH,h-210);if(size<200)size=200;var boardEl=document.getElementById('board');if(boardEl){boardEl.style.width=size+'px';boardEl.style.height=size+'px';}}
window.addEventListener('resize',fit);if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);window.visualViewport.addEventListener('scroll',fit);}
$('submitWord').onclick=commit;$('undo').onclick=undo;$('pass').onclick=pass;$('playWord').onclick=playTyped;$('shuffle').onclick=shuffleRack;
$('wordInput').onkeydown=function(e){if(e.key==='Enter'){if(waiting)return;e.preventDefault();playTyped();}};

$('btn-register').onclick=handleRegister;$('btn-begin').onclick=handleBegin;$('btn-invite').onclick=handleCreateInvitation;
$('btn-copy').onclick=function(){let u=$('invite-url').value;try{navigator.clipboard.writeText("Join me in a scrabble-like game on BearTracks: "+u)}catch(e){prompt("Copy:",u)}};
$('share-copy').onclick=function(){let u=$('share-url').value;try{navigator.clipboard.writeText("Join me in a scrabble-like game on BearTracks: "+u).catch(()=>{})}catch(e){prompt("Copy:",u)}};
$('btn-logout').onclick=function(){localStorage.removeItem("bt_owner");$('setup').hidden=false;renderBoxes();$('reg-user').value='';$('reg-pass').value='';$('reg-pass2').value='';$('nameB').value='';$('invite-copy').hidden=true;let sp=$('share-panel');if(sp)sp.hidden=true;currentInvite=null;$('bt-headsup').hidden=true;pendingGameForHeadsUp=null;};
$('reg-user').onkeydown=function(e){if(e.key==='Enter')handleRegister()};$('reg-pass2').onkeydown=function(e){if(e.key==='Enter')handleRegister()};$('nameB').onkeydown=function(e){if(e.key==='Enter')handleBegin()};
$('bt-headsup-copy-msg').onclick=handleHeadsUpCopyMsg;$('bt-headsup-copy-link').onclick=handleHeadsUpCopyLink;$('bt-headsup-continue').onclick=handleHeadsUpContinue;

(async()=>{
  let iid=null;
  try{ iid=new URLSearchParams(location.search).get("invite"); }catch(e){}
  let owner=getOwner();
  let hasState=false;
  if(iid){
    let inv=await loadInvite(iid);
    if(inv){
      currentInvite=inv;
      if(owner){
        let g=null; if(inv.gameId) g=await loadGame(inv.gameId);
        if(g){ state=g; addGameId(g.id); hasState=true; }
      }else{ hasState=false; }
    }
  }
  if(!hasState){ var hs=tryLoadFromHash(); if(hs){ state=hs; hasState=true; } }
  try{
    if(!state){
      let gsTxt=$('game-state').textContent;
      if(gsTxt && gsTxt.trim()!=='null' && gsTxt.trim()!==''){ state=JSON.parse(gsTxt); hasState=!!state; }
    }
  }catch(e){}
  if(state && owner && hasState){ $('setup').hidden=true; render(); }
  else{ $('setup').hidden=false; renderBoxes(); }
  fit();
})();
}());
