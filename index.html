<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BearTracks</title>
<style>
:root{--cell:clamp(14px,1.9vw,28px);--gap:2px;--board-bg:#000;--rack-bg:#cfe1b0;--olive:#4a5a2c;--tile-bg:#fff;--tile-blank:#ffe6ef;--side-bg:#eef4df;--card-bg:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--rack-bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;overflow:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px;height:100dvh;overflow:hidden}
.mast{display:flex;align-items:baseline;justify-content:space-between}
.brand{font-size:clamp(24px,4vw,44px);font-weight:900;letter-spacing:.2px}.brand small{display:block;font-size:12px;color:var(--olive)}
.turn-pill{border:1px solid #b7bcad;border-radius:999px;padding:6px 10px;background:#fff;font-size:12px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:10px;align-items:start;flex:1;min-height:0;overflow:hidden}
.left-col{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.board{display:grid;grid-template-columns:repeat(15,1fr);gap:var(--gap);background:var(--board-bg);border:4px solid var(--board-bg);border-radius:8px;aspect-ratio:1/1;width:100%;max-width:100%;flex-shrink:0;min-height:0;touch-action:none}
.cell{position:relative;background:#f8faf1;border:0;padding:0;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;overflow:hidden;user-select:none}
.cell.tw{background:#d92a2a}.cell.dw{background:#f3a3b8}.cell.tl{background:#2a7bd9}.cell.dl{background:#a9c9ea}
.premium{font-size:11px;font-weight:900;color:#000;opacity:.75}.cell.anchor{outline:3px solid #ffcf24;outline-offset:-3px}
.tile{width:90%;height:90%;background:var(--tile-bg);border:1px solid #0003;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(11px,1.4vw,18px);position:relative}.tile.blank{background:var(--tile-blank)}
.tile b{position:absolute;right:1px;bottom:0;font-size:8px}
.below-board{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.rack{width:100%;background:var(--rack-bg);border:1px solid #9caf88;border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rack-tile{background:#fff;border:1px solid #0002;border-radius:6px;padding:6px 0;font-weight:800;display:flex;flex-direction:column;align-items:center}
.rack-tile.selected{outline:2px solid #000}.rack-tile small{font-size:10px;opacity:.7}
.entry-row{display:flex;gap:6px;align-items:center}.entry-row input{flex:1;border:1px solid #b7bcad;border-radius:8px;padding:10px 12px;font-size:15px}
.action{border:0;border-radius:8px;background:var(--olive);color:#fff;padding:8px 10px;font-weight:700}.action.alt{background:#6b7e4f}
.gameplay-box{border:1px solid #b7bcad;border-radius:8px;background:#fff;padding:6px 8px;min-height:42px;display:flex;flex-direction:column;gap:2px}
.placement{font-size:12px;color:#333}.status{font-size:12px;color:#444;min-height:18px}.status.prompt{animation:blink 1.2s steps(2,start) infinite;background:#ffeb3b}
@keyframes blink{50%{opacity:.35}}
.actions-row{display:flex;gap:6px;flex-wrap:wrap}
.side{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.card{background:var(--card-bg);border:1px solid #b7bcad;border-radius:10px;padding:8px}
.card h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4a5a2c}
.scores{display:flex;flex-direction:column;gap:6px}.score{display:flex;justify-content:space-between;border:1px solid #cbd5bd;border-radius:8px;padding:6px 8px;background:#f7faef}.score.active{background:#fff9c4}
.history{margin:0;padding-left:18px;max-height:220px;overflow:auto;font-size:12px}
.help{font-size:12px;color:#4a5a2c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
.modal[hidden]{display:none}
.dialog{background:#fff;border-radius:12px;padding:16px;min-width:320px;max-width:420px;width:90%;display:flex;flex-direction:column;gap:10px}
.dialog h1{margin:0;font-size:20px}.dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.dialog input{border:1px solid #b7bcad;border-radius:8px;padding:8px}
.start-game-box{display:flex;flex-direction:column;gap:8px;border:1px solid #b7bcad;border-radius:10px;padding:10px}
.error{color:#b00020;font-size:12px;min-height:14px}
#bt-headsup{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:center;justify-content:center}
#bt-headsup[hidden]{display:none}
#bt-headsup-box{background:#fff;border-radius:12px;padding:12px;display:flex;gap:10px;min-width:360px;max-width:560px;width:90%}
#bt-headsup-left{flex:1;display:flex;flex-direction:column;gap:6px}
#bt-headsup-input{width:100%;min-height:84px;border:1px solid #b7bcad;border-radius:8px;padding:8px;font-size:12px}
#bt-headsup-right{display:flex;flex-direction:column;gap:6px;min-width:140px}
#bt-headsup-right button{border:0;border-radius:8px;padding:8px;background:var(--olive);color:#fff;font-weight:700}
#bt-headsup-right button:disabled{opacity:.5}
</style>
</head>
<body>
<main class="wrap" id="game">
<header class="mast"><div class="brand">BearTracks<small>Destination unknown, but we'll get there together.</small></div><div class="turn-pill" id="turnPill"></div></header>
<div class="layout"><section class="left-col"><div class="board" id="board"></div><div class="below-board"><div class="rack" id="rack"></div><div class="entry-row"><input id="wordInput" maxlength="30" placeholder="Type word or word 8,8,0"><button class="action alt" id="shuffle">Shuffle</button><button class="action" id="playWord">Play</button></div><div class="gameplay-box" id="gameplayBox"><div class="placement" id="placement"></div><div class="status" id="status"></div></div><div class="actions-row"><button class="action" id="submitWord">Submit Word</button><button class="action alt" id="undo">Undo</button><button class="action alt" id="pass">Pass</button></div></div></section><aside class="side"><section class="card" id="share-panel" hidden><h2>Share</h2><div class="help" id="share-help"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="share-url" readonly style="flex:1;border:1px solid #b7bcad;border-radius:8px;padding:8px"><button id="share-copy" class="action alt">Copy</button></div></section><section class="card"><h2>Scoreboard</h2><div class="scores" id="scores"></div><p class="help" id="bag"></p></section><section class="card"><h2>Moves</h2><ol class="history" id="history"></ol><button class="action alt" id="help" style="margin-top:10px;width:100%">How this works</button></section></aside></div>
</main>
<div class="modal" id="setup"><section class="dialog">
<div id="box-register" class="start-game-box"><h1>BearTracks Registration</h1><p>Register to play.</p><label>Username<input id="reg-user" placeholder="Username" autofocus autocomplete="username"></label><label>Password<input id="reg-pass" type="password"></label><label>Confirm password<input id="reg-pass2" type="password"></label><button id="btn-register">Register</button><div id="reg-error" class="error"></div></div>
<div id="box-start" class="start-game-box" hidden><h1>Start a game</h1><div><strong id="owner-name"></strong></div><label>Opponent's name (optional)<input id="nameB" maxlength="28" placeholder="Opponent username"></label><div style="display:flex;gap:8px;margin-top:10px"><button id="btn-begin">Begin Game</button><button id="btn-invite" class="action alt">Create Invitation</button></div><div id="invite-copy" hidden><div class="help">Join me in a scrabble-like game on BearTracks:</div><div style="display:flex;gap:6px"><input id="invite-url" readonly><button id="btn-copy">Copy</button></div></div><button id="btn-logout" class="action alt" style="margin-top:12px">Log out</button></div>
</section></div>
<div id="bt-headsup" hidden><div id="bt-headsup-box"><div id="bt-headsup-left"><div id="bt-headsup-help">Join me in a scrabble-like game on BearTracks:</div><textarea id="bt-headsup-input" readonly></textarea></div><div id="bt-headsup-right"><button id="bt-headsup-copy-msg" disabled>Message copied</button><button id="bt-headsup-copy-link">Copy link instead</button><button id="bt-headsup-continue">Continue to game</button></div></div></div>
<script id="game-state" type="application/json">null</script>
<script>
(function(){
'use strict';
var N=15,C=7,V={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,"?":0};
var D={A:9,B:2,C:2,D:4,E:12,F:2,G:3,H:2,I:9,J:1,K:1,L:4,M:2,N:6,O:8,P:2,Q:1,R:6,S:4,T:6,U:4,V:2,W:2,X:1,Y:2,Z:1,"?":2};
var TW=[[0,0],[0,7],[0,14],[7,0],[7,14],[14,0],[14,7],[14,14]],DW=[[1,1],[2,2],[3,3],[4,4],[10,10],[11,11],[12,12],[13,13],[1,13],[2,12],[3,11],[4,10],[10,4],[11,3],[12,2],[13,1],[7,7]],TL=[[1,5],[1,9],[5,1],[5,5],[5,9],[5,13],[9,1],[9,5],[9,9],[9,13],[13,5],[13,9]],DL=[[0,3],[0,11],[2,6],[2,8],[3,0],[3,7],[3,14],[6,2],[6,6],[6,8],[6,12],[7,3],[7,11],[8,2],[8,6],[8,8],[8,12],[11,0],[11,7],[11,14],[12,6],[12,8],[14,3],[14,11]];
var state=null,pending=[],selected=-1,anchor=null,dragItem=null,gesture=null,suppressClick=false,waiting=false,waitingRack=null,waitingOpp=null,pendingWord=null;
const API="https://tracker-api.beartracksgames.workers.dev";const LIVE_SITE="https://rljhaines.github.io/beartracks/";
let currentInvite=null;
function getOwner(){return localStorage.getItem("bt_owner")}
function getOpponents(){try{return JSON.parse(localStorage.getItem("bt_opponents")||"[]")}catch(e){return[]}}
function addOpponent(n){if(!n)return;let o=getOpponents();if(o.indexOf(n)===-1){o.push(n);localStorage.setItem("bt_opponents",JSON.stringify(o))}}
function getAllGameIds(){try{return JSON.parse(localStorage.getItem("bt_all_game_ids")||"[]")}catch(e){return[]}}
function addGameId(id){if(!id)return;let a=getAllGameIds();if(a.indexOf(id)===-1){a.push(id);localStorage.setItem("bt_all_game_ids",JSON.stringify(a))}}
async function loadInvite(id){for(let k=0;k<3;k++){try{let r=await fetch(API+"/invites/"+id);if(r.ok){let j=await r.json();return j.invite}}catch(e){}await new Promise(r=>setTimeout(r,400));}return null}
async function loadGame(id){for(let k=0;k<3;k++){try{let r=await fetch(API+"/games/"+id);if(r.ok){let j=await r.json();return j.game}}catch(e){}await new Promise(r=>setTimeout(r,400));}return null}
function makeInviteUrl(id){return LIVE_SITE+"?invite="+encodeURIComponent(id);}
function makeGameStateUrl(gs){
  try{
    let json=JSON.stringify(gs);
    let bytes=new TextEncoder().encode(json);
    let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    let b64=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return LIVE_SITE+"#s="+b64;
  }catch(e){
    let b64=btoa(unescape(encodeURIComponent(JSON.stringify(gs)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    return LIVE_SITE+"#s="+b64;
  }
}
async function saveGameToCF(g){addGameId(g.id);try{let r=await fetch(API+"/games/"+g.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});if(r.status===404){r=await fetch(API+"/games",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});}if(!r.ok)throw new Error("save game failed "+r.status);}catch(e){try{localStorage.setItem("bt_pending_game_"+g.id,JSON.stringify(g));}catch(_e){}}return g;}
async function saveInviteToCF(inv){try{let r=await fetch(API+"/invites",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({invite:inv})});if(!r.ok)throw new Error("save invite failed "+r.status);}catch(e){try{localStorage.setItem("bt_pending_invite_"+inv.id,JSON.stringify(inv));}catch(_e){}}return inv;}
function renderBoxes(){let owner=getOwner();let br=document.getElementById("box-register"),bs=document.getElementById("box-start");if(!br||!bs)return;if(!owner){br.hidden=false;bs.hidden=true;let sp=document.getElementById("share-panel");if(sp)sp.hidden=true;requestAnimationFrame(()=>{setTimeout(()=>{let f=document.getElementById("reg-user");if(f){f.focus();f.select();}},50);});}else{br.hidden=true;bs.hidden=false;let on=document.getElementById("owner-name");if(on)on.textContent=owner;setTimeout(()=>{let f=document.getElementById("nameB");if(f)f.focus();},0);}}
function $(id){return document.getElementById(id)}
function has(a,r,c){for(var i=0;i<a.length;i++)if(a[i][0]===r&&a[i][1]===c)return true;return false}
function premium(r,c){if(has(TW,r,c))return'TW';if(has(DW,r,c))return'DW';if(has(TL,r,c))return'TL';if(has(DL,r,c))return'DL';return''}
function esc(t){return String(t).replace(/[&<>"']/g,function(x){return{'&':'&amp;','<':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function tile(l){return{l:l,blank:l==='?'}}
function draw(s,p){while(p.rack.length<7&&s.bag.length)p.rack.push(tile(s.bag.pop()))}
function fresh(a,b){
  var bag=[],k,i;for(k in D)for(i=0;i<D[k];i++)bag.push(k);shuffle(bag);
  var s={version:4,id:(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),players:[{name:a,score:0,rack:[]},{name:b,score:0,rack:[]}],board:[],bag:bag,turn:0,history:[],moveCount:0,undoStack:[]};
  for(i=0;i<N;i++)s.board.push(Array(N).fill(null));
  draw(s,s.players[0]);draw(s,s.players[1]);
  s.players[0].rack=s.players[0].rack.map(function(t){return {l:t.l,blank:!!t.blank}});
  s.players[1].rack=s.players[1].rack.map(function(t){return {l:t.l,blank:!!t.blank}});
  if(s.players[0].rack.length===7&&s.players[1].rack.length===7){
    let a0=s.players[0].rack.map(x=>x.l).sort().join(''),a1=s.players[1].rack.map(x=>x.l).sort().join('');
    if(a0===a1){s.bag.push(s.players[1].rack.pop().l);shuffle(s.bag);draw(s,s.players[1]);}
  }
  return s;
}
function cloneRacks(g){
  if(!g||!g.players) return g;
  g.players[0].rack=g.players[0].rack.map(function(t){return {l:t.l,blank:!!t.blank}});
  g.players[1].rack=g.players[1].rack.map(function(t){return {l:t.l,blank:!!t.blank}});
  if(g.players[0].rack===g.players[1].rack){g.players[1].rack=g.players[1].rack.slice().map(function(t){return {l:t.l,blank:!!t.blank}});}
  return g;
}
function message(t,isPrompt){var el=$('status');el.textContent=t;el.classList.remove('prompt');void el.offsetWidth;if(isPrompt)el.classList.add('prompt')}
function clearPrompt(){var el=$('status');el.classList.remove('prompt');}
function getLocalIdx(){let owner=(getOwner()||"").toLowerCase();if(!state) return 0;for(let i=0;i<state.players.length;i++){if((state.players[i].name||"").toLowerCase()===owner) return i;}return 1;}
function getLocalRack(){ if(!state) return []; return state.players[getLocalIdx()].rack; }
function getMoverIdxForCommit(){
  if(!state) return getLocalIdx();
  if((state.moveCount||0)===0){return getLocalIdx();}
  return state.turn;
}
function renderRack(){if(!state) return;var rack=getLocalRack();var rh='';for(var i=0;i<rack.length;i++){rh+='<button draggable="true" class="rack-tile '+(i===selected?'selected':'')+'" data-i="'+i+'">'+rack[i].l+'<small>'+V[rack[i].l]+'</small></button>';}$('rack').innerHTML=rh;var rs=$('rack').getElementsByTagName('button');for(i=0;i<rs.length;i++){rs[i].onclick=pick;rs[i].ondragstart=dragRack;}}
function render(){
  if(!state)return;
  waiting=false;waitingRack=null;waitingOpp=null;
  let li=getLocalIdx();
  let isMyTurn = (state.moveCount===0)? true : (state.turn===li);
  var b=$('board');b.innerHTML='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var btn=document.createElement('button');
    btn.className='cell '+premium(r,c).toLowerCase()+(anchor&&anchor.r===r&&anchor.c===c?' anchor':'');
    btn.dataset.r=r;btn.dataset.c=c;
    if(state.board[r][c]&&isNew(r,c))btn.draggable=true;
    var t2=state.board[r][c];var pr=premium(r,c);
    if(t2){var sp=document.createElement('span');sp.className='tile '+(t2.blank?'blank':'');sp.textContent=t2.l;var b2=document.createElement('b');b2.textContent=t2.blank?0:V[t2.l];sp.appendChild(b2);btn.appendChild(sp);}
    else if(pr){var prs=document.createElement('span');prs.className='premium';prs.textContent=pr;btn.appendChild(prs);}
    b.appendChild(btn);
  }
  var cells=b.getElementsByTagName('button');
  for(var i=0;i<cells.length;i++){cells[i].onclick=place;cells[i].ondblclick=vertical;cells[i].ondragover=allowDrop;cells[i].ondrop=dropCell;cells[i].ondragstart=dragBoard;cells[i].onmousedown=startGesture;cells[i].onmouseup=endGesture}
  renderRack();
  if(state.moveCount===0){
    $('scores').innerHTML=state.players.map(function(x){return '<div class="score"><span>'+esc(x.name)+'</span><strong>'+x.score+'</strong></div>'}).join('');
  }else{
    $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+(i===state.turn?' - turn':'')+'</span><strong>'+x.score+'</strong></div>'}).join('');
  }
  $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
  $('bag').textContent=state.bag.length+' tiles remain.';
  if(state.moveCount===0){
    $('turnPill').textContent='Decide first move - longest word';
  }else{
    $('turnPill').textContent=isMyTurn? 'Your turn ('+state.players[li].name+')' : state.players[state.turn].name+"'s turn";
  }
  $('placement').textContent=anchor?'Starts at '+String.fromCharCode(65+anchor.c)+(anchor.r+1)+' '+(anchor.d==='H'?'across':'down'):'';
  $('wordInput').disabled=!isMyTurn;
  $('wordInput').placeholder=isMyTurn?'Type word or word 8,8,0 (1-15)':'Waiting for '+state.players[state.turn].name;
  $('playWord').disabled=!isMyTurn;
  $('submitWord').disabled=!isMyTurn;
  $('pass').disabled=false;
  $('undo').disabled=!isMyTurn;
  if(!pending.length&&!pendingWord){
    if(state.moveCount===0){
      let other=state.players[1-li].name;
      message(state.players[li].name+': first move - type word then click board. Pass to let '+other+' start.');
    }else{
      message(isMyTurn? state.players[li].name+': type word + Enter, add 8,8,0 for coords (1-15), or word alone then click board.' : 'Waiting for '+state.players[state.turn].name+' to play.');
    }
  }
  setTimeout(function(){var inp=$('wordInput');if(inp)inp.focus();},0);
}
function renderWaitingRack(){var rh='';for(var i=0;i<waitingRack.length;i++)rh+='<button class="rack-tile" disabled>'+waitingRack[i].l+'<small>'+V[waitingRack[i].l]+'</small></button>';$('rack').innerHTML=rh;}
function enterWaitingMode(myRack,opponentName,isPass){
  waiting=true;waitingRack=myRack.slice();waitingOpp=opponentName;
  renderWaitingRack();
  $('wordInput').value='';$('wordInput').disabled=true;$('wordInput').placeholder='Waiting';
  $('playWord').disabled=true;$('submitWord').disabled=true;$('pass').disabled=true;$('undo').disabled=true;
  $('turnPill').textContent='Waiting for '+opponentName;
  if(isPass){$('placement').textContent='';var el=$('status');el.textContent='';el.classList.remove('prompt');}
  else{$('placement').textContent='Game saved to cloud. Backup link copied.';var el2=$('status');el2.textContent="The Bear's tracks have been captured. Backup game-state link in clipboard.";el2.classList.remove('prompt');}
}
function shuffleRack(){if(waiting&&waitingRack){shuffle(waitingRack);renderWaitingRack();return;}if(!state)return;shuffle(getLocalRack());selected=-1;renderRack();}
function pick(e){if(waiting)return;let li=getLocalIdx();let isMyTurn=(state.moveCount===0)?true:(state.turn===li);if(!isMyTurn) return;var n=Number(e.currentTarget.getAttribute('data-i'));selected=(selected===n)?-1:n;renderRack();}
function place(e){if(waiting)return;let li=getLocalIdx();let isMyTurn=(state.moveCount===0)?true:(state.turn===li);if(!isMyTurn) return;if(suppressClick){suppressClick=false;return}var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));if(pendingWord){anchor={r:r,c:c,d:'H'};placeWordAtAnchor(pendingWord);return;}if(selected<0){anchor={r:r,c:c,d:'H'};render();if(!$('wordInput').value.trim()){$('placement').textContent='Starts at '+String.fromCharCode(65+c)+(r+1)+' across — type your word';message('Type your word then click Play',true);}return;}if(state.board[r][c])return message('That square is occupied.');putTile(r,c,getLocalRack().splice(selected,1)[0]);selected=-1;render();}

async function linkGameViaInvite(inviteId,newUsername){
  let inv=null;
  for(let a=0;a<5;a++){inv=await loadInvite(inviteId);if(inv)break;await new Promise(r=>setTimeout(r,500));}
  if(!inv)return null;
  if(inv.gameId){
    for(let a=0;a<5;a++){
      let g=await loadGame(inv.gameId);
      if(g){
        g=cloneRacks(g);
        let p1=(g.players[1].name||"").toLowerCase();
        let isPlaceholder = p1==="opponent"||p1===""||p1==="opponent updated to "+newUsername.toLowerCase() || p1.indexOf("opponent")===0;
        if(isPlaceholder || p1===newUsername.toLowerCase()){
          let old=g.players[1].name;
          g.players[1].name=newUsername;
          try{await fetch(API+"/games/"+g.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});}catch(e){}
          if(old.toLowerCase().indexOf("opponent")===0){
            try{localStorage.setItem("bt_last_update","Opponent updated to "+newUsername);}catch(e){}
          }
        }
        addOpponent(g.players[0].name);addOpponent(g.players[1].name);addGameId(g.id);return g;
      }
      await new Promise(r=>setTimeout(r,400));
    }
  }
  let fb=fresh(inv.invitedBy||"pooh",newUsername);
  try{await saveGameToCF(fb);inv.gameId=fb.id;inv.mode="game-invite";await saveInviteToCF(inv);}catch(e){}
  addOpponent(inv.invitedBy||"pooh");addGameId(fb.id);
  try{localStorage.setItem("bt_last_update","Opponent updated to "+newUsername);}catch(e){}
  return fb;
}
async function handleRegister(){

      await new Promise(r=>setTimeout(r,800));

  }
  // no invite param: check local games for Opponent placeholder and update it
  let ids=getAllGameIds();
  for(let i=ids.length-1;i>=0;i--){
    let g=await loadGame(ids[i]);
    if(!g)continue;
    g=cloneRacks(g);
    let p0=(g.players[0].name||"").toLowerCase();
    let p1=(g.players[1].name||"").toLowerCase();
    if(p1==="opponent" || p1==="" || p1.indexOf("opponent")===0){
      if(p0!==u.toLowerCase()){
        let oldName=g.players[1].name;
        g.players[1].name=u;
        try{await fetch(API+"/games/"+g.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({game:g})});}catch(e){}
        addOpponent(g.players[0].name);
        state=g;$('setup').hidden=true;
        try{localStorage.setItem("bt_last_update","Opponent updated to "+u);}catch(e){}
        if(errEl){errEl.style.color='#2e7d32';errEl.textContent="Opponent updated to "+u+(oldName?" (was "+oldName+")":"");}
        didUpdate=true;
        render();
        return;
      }
    }
    if((g.players[1].name||"").toLowerCase()===u.toLowerCase()||(g.players[0].name||"").toLowerCase()===u.toLowerCase()){
      state=g;$('setup').hidden=true;render();return;
    }
  }
  if(!didUpdate && errEl){
    let last=null;try{last=localStorage.getItem("bt_last_update");}catch(e){}
    if(last){errEl.style.color='#2e7d32';errEl.textContent=last;}

}

  let btnMsg=$('bt-headsup-copy-msg');if(btnMsg){btnMsg.disabled=isInvite;btnMsg.textContent=isInvite?"Message copied":"Copy message instead";}
  let btnLink=$('bt-headsup-copy-link');if(btnLink){btnLink.disabled=!isInvite;btnLink.textContent=isInvite?"Copy link instead":"Link copied";}
  $('bt-headsup').hidden=false;pendingGameForHeadsUp=gameObj;
  showShare(url,isInvite?false:true);
  if(isInvite){let iu=$('invite-url');if(iu)iu.value=url;let ic=$('invite-copy');if(ic)ic.hidden=false;}
}
function handleHeadsUpCopyMsg(){headsupMode="msg";$('bt-headsup-input').value=headsupData.msg;try{navigator.clipboard.writeText(headsupData.msg).catch(()=>{});}catch(e){}$('bt-headsup-copy-msg').disabled=true;$('bt-headsup-copy-msg').textContent="Message copied";$('bt-headsup-copy-link').disabled=false;$('bt-headsup-copy-link').textContent=headsupData.isInvite?"Copy link instead":"Copy link";}
function handleHeadsUpCopyLink(){headsupMode="link";$('bt-headsup-input').value=headsupData.url;try{navigator.clipboard.writeText(headsupData.url).catch(()=>{});}catch(e){}$('bt-headsup-copy-link').disabled=true;$('bt-headsup-copy-link').textContent="Link copied";$('bt-headsup-copy-msg').disabled=false;$('bt-headsup-copy-msg').textContent="Copy message instead";}
function handleHeadsUpContinue(){
  $('bt-headsup').hidden=true;
  if(pendingGameForHeadsUp){
    let g=pendingGameForHeadsUp;
    state=g;
    $('setup').hidden=true;
    render();
    pendingGameForHeadsUp=null;
  }
}
async function handleBegin(){
  let owner=getOwner();if(!owner){renderBoxes();return;}
  let opp=($('nameB')?$('nameB').value.trim():'');
  let g=fresh(owner,opp||"Opponent");
  await saveGameToCF(g);
  if(!opp){
    let iid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    currentInvite={id:iid,invitedBy:owner,invitedByOpponents:getOpponents(),gameId:g.id,mode:"game-invite",created:Date.now()};
    try{await saveInviteToCF(currentInvite);}catch(e){}
    addOpponent(opp); await showHeadsUp(iid,g,true);
  }else{
    currentInvite=null;
    if(opp) addOpponent(opp);
    await showHeadsUp(null,g,false);
  }
}
async function handleCreateInvitation(){
  let owner=getOwner();if(!owner){renderBoxes();return;}
  let id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  let placeholder=fresh(owner,"Opponent");
  await saveGameToCF(placeholder);
  let inv={id:id,invitedBy:owner,invitedByOpponents:getOpponents(),gameId:placeholder.id,mode:"unregistered-invite",created:Date.now()};
  await saveInviteToCF(inv);currentInvite=inv;
  await showHeadsUp(id,placeholder,true);
}
function fit(){var vv=window.visualViewport;var w=vv?vv.width:window.innerWidth;var h=vv?vv.height:window.innerHeight;var mast=document.querySelector('.mast')?.offsetHeight||50;var below=document.querySelector('.below-board')?.offsetHeight||96;var availH=h-mast-below-32;var leftColW=document.querySelector('.left-col')?.clientWidth||w;var size=Math.min(leftColW,availH,h-210);if(size<200)size=200;var boardEl=document.getElementById('board');if(boardEl){boardEl.style.width=size+'px';boardEl.style.height=size+'px';}}
window.addEventListener('resize',fit);if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);window.visualViewport.addEventListener('scroll',fit);}
$('submitWord').onclick=commit;$('undo').onclick=undo;$('pass').onclick=pass;$('playWord').onclick=playTyped;$('shuffle').onclick=shuffleRack;
$('wordInput').onkeydown=function(e){if(e.key==='Enter'){if(waiting)return;e.preventDefault();playTyped();}};
$('wordInput').addEventListener('input',function(){
  if(waiting) return;
  if(!anchor) return;
  let raw=this.value;
  if(!raw){
    if(pending.length){
      let lr=getLocalRack();
      for(let i=pending.length-1;i>=0;i--){let x=pending[i];state.board[x.r][x.c]=null;lr.push(x.tile.blank?tile('?'):x.tile);}
      pending=[]; render();
    }
    return;
  }
  let parsed=parseEntry(raw);
  let word=parsed.word;
  if(!word) return;
  if(word.length>=1) placeWordAtAnchor(word);
});
$('help').onclick=function(){alert('Type word + Enter. Add 8,8,0 across / 8,8,1 down in any order (1-15). Or word alone then click board. Contestants decide first move by longest word.') };
$('btn-register').onclick=handleRegister;$('btn-begin').onclick=handleBegin;$('btn-invite').onclick=handleCreateInvitation;
$('btn-copy').onclick=function(){let u=$('invite-url').value;try{navigator.clipboard.writeText("Join me in a scrabble-like game on BearTracks: "+u)}catch(e){prompt("Copy:",u)}};
$('share-copy').onclick=function(){let u=$('share-url').value;try{navigator.clipboard.writeText(u).catch(()=>{})}catch(e){prompt("Copy:",u)}};
$('btn-logout').onclick=function(){localStorage.removeItem("bt_owner");$('setup').hidden=false;renderBoxes();$('reg-user').value='';$('reg-pass').value='';$('reg-pass2').value='';$('nameB').value='';$('invite-copy').hidden=true;let sp=$('share-panel');if(sp)sp.hidden=true;currentInvite=null;$('bt-headsup').hidden=true;pendingGameForHeadsUp=null;};
$('reg-user').onkeydown=function(e){if(e.key==='Enter')handleRegister()};$('reg-pass2').onkeydown=function(e){if(e.key==='Enter')handleRegister()};$('nameB').onkeydown=function(e){if(e.key==='Enter')handleBegin()};
$('bt-headsup-copy-msg').onclick=handleHeadsUpCopyMsg;$('bt-headsup-copy-link').onclick=handleHeadsUpCopyLink;$('bt-headsup-continue').onclick=handleHeadsUpContinue;
(async()=>{
  let iid=null;try{ iid=new URLSearchParams(location.search).get("invite"); }catch(e){}
  let owner=getOwner();let hasState=false;
  let sState=tryLoadFromHash();
  if(sState){ state=sState; hasState=true; }
  if(!hasState && iid){
    let inv=await loadInvite(iid);
    if(inv){
      currentInvite=inv;
      if(owner){
        let g=null; if(inv.gameId) g=await loadGame(inv.gameId);
        if(g){ g=cloneRacks(g); state=g; addGameId(g.id); hasState=true; }
      }
    }
  }
  try{
    if(!state){
      let gsTxt=$('game-state').textContent;
      if(gsTxt && gsTxt.trim()!=='null' && gsTxt.trim()!==''){ state=cloneRacks(JSON.parse(gsTxt)); hasState=!!state; }
    }
  }catch(e){}
  if(state && owner && hasState){ $('setup').hidden=true; render(); }
  else{ $('setup').hidden=false; renderBoxes(); }
  fit();
})();
}());
