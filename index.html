<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BearTracks</title>
<script id="lexicon" type="application/json">null</script>
<style>
  :root{--ink:#23392f;--paper:#f6f0e4;--tile:#f8e5af;--line:#d7cfbd;--green:#28604b;--orange:#d66f42;--muted:#65756b;--gap:2px;--pad:4px}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1300px;margin:auto;padding:22px}.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{font-size:29px;font-weight:800;letter-spacing:-1.2px}.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);margin-top:3px}.turn-pill{background:#e5eee7;border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(500px,1fr) 300px;gap:20px}.left-col{display:flex;flex-direction:column;gap:0}
.board{display:grid;grid-template-columns:repeat(15,1fr);gap:var(--gap);padding:var(--pad);background:#315647;border-radius:9px;aspect-ratio:1;width:100%}
.cell{border:0;min-width:0;padding:0;position:relative;background:#e7d9bd;color:#274336;cursor:pointer;aspect-ratio:1}.cell:focus{outline:3px solid var(--orange);z-index:2}.cell.anchor{outline:3px solid var(--orange);z-index:2}
.premium{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:800;line-height:1.05}.tw{background:#cf7c6f;color:white}.dw{background:#e6aaa2}.tl{background:#5c99aa;color:white}.dl{background:#a8cbd0}
.tile{position:absolute;inset:3px;background:var(--tile);border-radius:4px;box-shadow:0 1px 2px #8d7548;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.1vw,26px);font-weight:900;color:#25291e}.tile b{position:absolute;right:3px;bottom:1px;font-size:9px}.tile.blank:after{content:"•";font-size:10px;position:absolute;top:1px;left:4px}
.below-board{display:grid;grid-template-columns:repeat(15,1fr);gap:var(--gap);margin-top:8px;width:100%;padding:0 var(--pad);align-items:start}
.rack{grid-column:1 / 8;grid-row:1;display:grid;grid-template-columns:repeat(7,1fr);gap:var(--gap);width:100%}
.rack-tile{aspect-ratio:1;width:100%;border:0;border-radius:4px;background:var(--tile);box-shadow:0 1px 2px #8d7548;position:relative;font-size:clamp(13px,2.1vw,26px);font-weight:900;color:#25291e;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rack-tile small{position:absolute;right:3px;bottom:1px;font-size:9px}.rack-tile.selected{outline:3px solid var(--orange);transform:translateY(-2px);z-index:1}
.entry-row{grid-column:1 / 8;grid-row:2;display:flex;gap:6px;align-items:center;height:44px;width:100%}
.entry-row input{flex:1 1 0;min-width:0;height:44px;border:1px solid #b7bcad;border-radius:8px;padding:0 10px;font:inherit;text-transform:uppercase}
.entry-row input::placeholder{text-transform:none;font-style:italic;font-size:12px}
.entry-row button{height:44px;flex:0 0 auto;padding:0 14px;white-space:nowrap;border:0;border-radius:8px;font-weight:800;cursor:pointer}
  #shuffle{background:#e4dfd3;color:var(--ink)}#playWord{background:var(--green);color:white}
.gameplay-box{grid-column:10 / 16;grid-row:1;align-self:start;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 2px 7px #362c1711}
.placement{font-size:11px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.status{font-size:11px;color:var(--ink);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;transition:color.2s}
.status.prompt{font-size:14px;font-style:normal;color:#c0392b;white-space:normal;animation:btPulse 0.5s ease-in-out 2}
@keyframes btPulse{0%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.actions-row{display:flex;gap:6px;margin-top:8px;grid-column:10 / 16;grid-row:2}
.side{display:flex;flex-direction:column;gap:12px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 7px #362c1711}.card h2{font-size:12px;letter-spacing:.8px;margin:0 0 9px;color:#426050}
.action{border:0;border-radius:9px;padding:11px 7px;font-weight:800;background:var(--green);color:white;cursor:pointer}.action:disabled{opacity:.5}.action.alt{background:#e4dfd3;color:var(--ink)}
.scores{display:grid;gap:8px}.score{padding-left:9px;border-left:4px solid #cbd4c9;display:flex;justify-content:space-between}.score.active{border-color:var(--orange)}
.history{margin:0;padding-left:18px;max-height:180px;overflow:auto;font-size:12px}.history li{margin:5px 0}.help{font-size:12px;line-height:1.4;color:#526359}
.modal{position:fixed;inset:0;background:#17342899;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal[hidden]{display:none}.dialog{width:min(460px,100%);background:#fffdf8;border-radius:15px;padding:23px;box-shadow:0 18px 55px #0008}.dialog h1{margin:0 0 8px}.dialog p{color:#526359;line-height:1.4}.dialog label{display:block;font-weight:700;margin:13px 0}.dialog input{display:block;width:100%;margin-top:5px;border:1px solid #b7bcad;border-radius:8px;padding:9px;font:inherit}.dialog input::placeholder{color:#9aa89e;font-style:italic}.dialog button{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 14px;font-weight:800;cursor:pointer;margin-top:8px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}.below-board{padding:0}}
</style>
</head>
<body>
<main class="wrap">
  <header class="mast"><div class="brand">BearTracks<small>ONE FILE. ONE TURN. SEND IT ON.</small></div><div class="turn-pill" id="turnPill"></div></header>
  <div class="layout">
    <section class="left-col">
      <div class="board" id="board"></div>
      <div class="below-board">
        <div class="rack" id="rack"></div>
        <div class="entry-row">
          <input id="wordInput" maxlength="30" placeholder="Type word or word 8,8,0">
          <button class="action alt" id="shuffle">Shuffle</button>
          <button class="action" id="playWord">Play</button>
        </div>
        <div class="gameplay-box" id="gameplayBox"><div class="placement" id="placement"></div><div class="status" id="status"></div></div>
        <div class="actions-row"><button class="action" id="submitWord">Submit Word</button><button class="action alt" id="undo">Undo</button><button class="action alt" id="pass">Pass</button></div>
      </div>
    </section>
    <aside class="side"><section class="card"><h2>Scoreboard</h2><div class="scores" id="scores"></div><p class="help" id="bag"></p></section><section class="card"><h2>Moves</h2><ol class="history" id="history"></ol><button class="action alt" id="help" style="margin-top:10px;width:100%">How this works</button></section></aside>
  </div>
</main>
<div class="modal" id="setup" hidden><section class="dialog"><h1>Start a game</h1><p>Enter names to deal seven letters each.</p><label>Your name (Player 1)<input id="nameA" maxlength="28" placeholder="Player 1" autofocus></label><label>Opponent's name (Player 2)<input id="nameB" maxlength="28" placeholder="Player 2"></label><button id="start">Deal seven letters & Generate Opponent Game</button></section></div>
<script id="game-state" type="application/json">null</script>
<script>
(function(){
  'use strict';
  var N=15,C=7, V={A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10,"?":0};
  var D={A:9,B:2,C:2,D:4,E:12,F:2,G:3,H:2,I:9,J:1,K:1,L:4,M:2,N:6,O:8,P:2,Q:1,R:6,S:4,T:6,U:4,V:2,W:2,X:1,Y:2,Z:1,"?":2};
  var TW=[[0,0],[0,7],[0,14],[7,0],[7,14],[14,0],[14,7],[14,14]], DW=[[1,1],[2,2],[3,3],[4,4],[10,10],[11,11],[12,12],[13,13],[1,13],[2,12],[3,11],[4,10],[10,4],[11,3],[12,2],[13,1],[7,7]], TL=[[1,5],[1,9],[5,1],[5,5],[5,9],[5,13],[9,1],[9,5],[9,9],[9,13],[13,5],[13,9]], DL=[[0,3],[0,11],[2,6],[2,8],[3,0],[3,7],[3,14],[6,2],[6,6],[6,8],[6,12],[7,3],[7,11],[8,2],[8,6],[8,8],[8,12],[11,0],[11,7],[11,14],[12,6],[12,8],[14,3],[14,11]];
  var state=null, pending=[], selected=-1, anchor=null, dragItem=null, gesture=null, suppressClick=false, waiting=false, waitingRack=null, waitingOpp=null, pendingWord=null;
  function $(id){return document.getElementById(id)} function has(a,r,c){for(var i=0;i<a.length;i++)if(a[i][0]===r&&a[i][1]===c)return true;return false}
  function premium(r,c){if(has(TW,r,c))return'TW';if(has(DW,r,c))return'DW';if(has(TL,r,c))return'TL';if(has(DL,r,c))return'DL';return''}
  function esc(t){return String(t).replace(/[&<>"']/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function tile(l){return{l:l,blank:l==='?'}} function draw(s,p){while(p.rack.length<7&&s.bag.length)p.rack.push(tile(s.bag.pop()))}
  function fresh(a,b){var bag=[],k,i;for(k in D)for(i=0;i<D[k];i++)bag.push(k);shuffle(bag);var s={version:4,id:(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),players:[{name:a,score:0,rack:[]},{name:b,score:0,rack:[]}],board:[],bag:bag,turn:0,history:[],moveCount:0,undoStack:[]};for(i=0;i<N;i++)s.board.push(Array(N).fill(null));draw(s,s.players[0]);draw(s,s.players[1]);return s}
  function message(t,isPrompt){var el=$('status');el.textContent=t;el.classList.remove('prompt');void el.offsetWidth;if(isPrompt){el.classList.add('prompt')} }
  function clearPrompt(){var el=$('status');el.classList.remove('prompt');}
  function render(){
    if(!state)return;waiting=false;waitingRack=null;waitingOpp=null;
    var b=$('board');b.innerHTML='';for(var r=0;r<N;r++)for(var c=0;c<N;c++){var btn=document.createElement('button');btn.className='cell '+premium(r,c).toLowerCase()+(anchor&&anchor.r===r&&anchor.c===c?' anchor':'');btn.dataset.r=r;btn.dataset.c=c;if(state.board[r][c]&&isNew(r,c))btn.draggable=true;var t2=state.board[r][c];var pr=premium(r,c);if(t2){var sp=document.createElement('span');sp.className='tile '+(t2.blank?'blank':'');sp.textContent=t2.l;var b2=document.createElement('b');b2.textContent=t2.blank?0:V[t2.l];sp.appendChild(b2);btn.appendChild(sp);}else if(pr){var prs=document.createElement('span');prs.className='premium';prs.textContent=pr;btn.appendChild(prs);}b.appendChild(btn);}
    var cells=b.getElementsByTagName('button');for(var i=0;i<cells.length;i++){cells[i].onclick=place;cells[i].ondblclick=vertical;cells[i].ondragover=allowDrop;cells[i].ondrop=dropCell;cells[i].ondragstart=dragBoard;cells[i].onmousedown=startGesture;cells[i].onmouseup=endGesture}
    var rack=state.players[state.turn].rack;var rh='';for(i=0;i<rack.length;i++)rh+='<button draggable="true" class="rack-tile '+(i===selected?'selected':'')+'" data-i="'+i+'">'+rack[i].l+'<small>'+V[rack[i].l]+'</small></button>';$('rack').innerHTML=rh;var rs=$('rack').getElementsByTagName('button');for(i=0;i<rs.length;i++){rs[i].onclick=pick;rs[i].ondragstart=dragRack}$('rack').ondragover=allowDrop;$('rack').ondrop=dropRack;$('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+(i===state.turn?' - turn':'')+'</span><strong>'+x.score+'</strong></div>'}).join('');$('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');$('bag').textContent=state.bag.length+' tiles remain.';$('turnPill').textContent=state.players[state.turn].name+"'s turn";$('placement').textContent=anchor?'Starts at '+String.fromCharCode(65+anchor.c)+(anchor.r+1)+' '+(anchor.d==='H'?'across':'down'):'';$('wordInput').disabled=false;$('wordInput').placeholder='Type word or word 8,8,0';$('playWord').disabled=false;$('submitWord').disabled=false;$('pass').disabled=false;$('undo').disabled=false;if(!pending.length&&!pendingWord)message(state.players[state.turn].name+': type word + Enter, add 8,8,0 for coords, or word alone then click board.');
    setTimeout(function(){ if(!waiting){ var inp=$('wordInput'); if(inp) inp.focus(); } },0);
  }
  function renderWaitingRack(){var rh='';for(var i=0;i<waitingRack.length;i++)rh+='<button class="rack-tile" disabled>'+waitingRack[i].l+'<small>'+V[waitingRack[i].l]+'</small></button>';$('rack').innerHTML=rh;}
  function enterWaitingMode(myRack, opponentName){
    waiting=true;waitingRack=myRack.slice();waitingOpp=opponentName;
    renderWaitingRack();
    $('wordInput').value='';$('wordInput').disabled=true;$('wordInput').placeholder='Waiting';
    $('playWord').disabled=true;$('submitWord').disabled=true;$('pass').disabled=true;$('undo').disabled=true;
    $('placement').textContent='Open link from opponent to continue play.';
    $('turnPill').textContent='Waiting for '+opponentName;
  }
  function shuffleRack(){if(waiting && waitingRack){shuffle(waitingRack);renderWaitingRack();return;}if(!state)return;shuffle(state.players[state.turn].rack);selected=-1;var rack=state.players[state.turn].rack;var rh='';for(var i=0;i<rack.length;i++)rh+='<button draggable="true" class="rack-tile '+(i===selected?'selected':'')+'" data-i="'+i+'">'+rack[i].l+'<small>'+V[rack[i].l]+'</small></button>';$('rack').innerHTML=rh;var rs=$('rack').getElementsByTagName('button');for(var j=0;j<rs.length;j++){rs[j].onclick=pick;rs[j].ondragstart=dragRack}}
  function pick(e){if(waiting)return;var n=Number(e.currentTarget.getAttribute('data-i'));selected=(selected===n)?-1:n;render()}
  function place(e){
    if(waiting)return;
    if(suppressClick){suppressClick=false;return}
    var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));
    if(pendingWord){
      anchor={r:r,c:c,d:'H'};
      placeWordAtAnchor(pendingWord);
      return;
    }
    if(selected<0){anchor={r:r,c:c,d:'H'};render();return}
    if(state.board[r][c])return message('That square is occupied.');
    putTile(r,c,state.players[state.turn].rack.splice(selected,1)[0]);selected=-1;render()
  }
  function vertical(e){
    if(waiting)return;
    e.preventDefault();
    var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));
    if(pendingWord){
      anchor={r:r,c:c,d:'V'};
      placeWordAtAnchor(pendingWord);
      return;
    }
    anchor={r:r,c:c,d:'V'};selected=-1;render();
  }
  function putTile(r,c,q){if(q.l==='?'){var z=prompt('Blank = a-z');z=(z||'').trim().toUpperCase();if(!/^[A-Z]$/.test(z)){state.players[state.turn].rack.push(q);message('Blank cancelled.');return false}q={l:z,blank:true}}state.board[r][c]=q;pending.push({r:r,c:c,tile:q});return true}
  function placeWordAtAnchor(word){
    if(!state) return;
    if(!anchor){ message('select a starting square with a click or double-click', true); return; }
    var dr=anchor.d==='V'?1:0, dc=anchor.d==='H'?1:0;
    var cands=[];
    if(state.board[anchor.r][anchor.c]){
      var bl=state.board[anchor.r][anchor.c].l;
      for(var k=0;k<word.length;k++) if(word[k]===bl) cands.push({r0:anchor.r - k*dr, c0:anchor.c - k*dc});
      if(!cands.length){ message('Anchor '+(anchor.r+1)+','+(anchor.c+1)+' is '+bl+' not in '+word); return; }
    }else{
      cands.push({r0:anchor.r,c0:anchor.c});
    }
    var last='';
    for(var ci=0;ci<cands.length;ci++){
      var r0=cands[ci].r0, c0=cands[ci].c0, copy=state.players[state.turn].rack.slice(), planned=[], ok=true;
      for(var i=0;i<word.length;i++){
        var r=r0+i*dr, c=c0+i*dc;
        if(r<0||r>=N||c<0||c>=N){ ok=false; last='Off board at '+(r+1)+','+(c+1); break; }
        if(state.board[r][c]){
          if(state.board[r][c].l!==word.charAt(i)){ ok=false; last='Conflict at '+(r+1)+','+(c+1)+' has '+state.board[r][c].l+' vs '+word.charAt(i); break; }
        }else{
          var at=copy.findIndex(function(x){return x.l===word.charAt(i)});
          if(at<0) at=copy.findIndex(function(x){return x.l==='?'});
          if(at<0){ ok=false; last='Need '+word.charAt(i)+' have ['+state.players[state.turn].rack.map(function(x){return x.l}).join('')+']'; break; }
          planned.push({r:r,c:c,q:copy.splice(at,1)[0],idx:i});
        }
      }
      if(!ok) continue;
      for(var j=0;j<planned.length;j++){
        var actual=state.players[state.turn].rack.findIndex(function(x){return x.l===planned[j].q.l});
        if(actual<0) actual=state.players[state.turn].rack.findIndex(function(x){return x.l==='?'});
        var q=state.players[state.turn].rack.splice(actual,1)[0];
        if(q.l==='?') q={l:word.charAt(planned[j].idx),blank:true};
        state.board[planned[j].r][planned[j].c]=q;
        pending.push({r:planned[j].r,c:planned[j].c,tile:q});
      }
      pendingWord=null;
      $('wordInput').value='';
      clearPrompt();
      render();
      return;
    }
    message(last||'Cannot place '+word);
  }
  function parseEntry(raw){
    if(!raw) return {word:'',nums:[]};
    var letters = (raw.match(/[A-Za-z]+/g)||[]).join('');
    var word = letters.toUpperCase();
    var numMatches = raw.match(/\d+/g) || [];
    var nums = numMatches.map(function(n){return parseInt(n,10);});
    return {word:word, nums:nums};
  }
  function playTyped(){
    if(waiting) return;
    var raw=$('wordInput').value.trim();
    if(!raw){ message('Type a word first.'); return; }
    var parsed=parseEntry(raw);
    var word=parsed.word;
    var nums=parsed.nums;
    if(!word){ message('Type a word first.'); return; }
    if(nums.length>=2){
      var rr=nums[0], cc=nums[1], dir=nums.length>=3?nums[2]:0;
      if(rr<1||rr>15||cc<1||cc>15){ message('Rows and cols 1-15. 1,1 is top-left.'); return; }
      if(dir!==0&&dir!==1){ message('Direction 0=across, 1=down.'); return; }
      anchor={r:rr-1,c:cc-1,d:dir===1?'V':'H'};
      placeWordAtAnchor(word);
    }else{
      pendingWord=word;
      message('select a starting square with a click or double-click', true);
      $('placement').textContent='Word: '+word+' — click for across, double-click for down';
    }
  }
  function allowDrop(e){if(waiting)return;e.preventDefault();} function dragRack(e){if(waiting)return;dragItem={kind:'rack',i:Number(e.currentTarget.getAttribute('data-i'))};}
  function dragBoard(e){if(waiting)return;var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));if(!isNew(r,c)){e.preventDefault();return}dragItem={kind:'board',r:r,c:c};}
  function dropCell(e){if(waiting)return;e.preventDefault();if(!dragItem)return;var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));if(state.board[r][c]&&!(dragItem.kind==='board'&&dragItem.r===r&&dragItem.c===c))return;if(dragItem.kind==='rack'){var q=state.players[state.turn].rack.splice(dragItem.i,1)[0];putTile(r,c,q)}else{var idx=-1;for(var i=0;i<pending.length;i++)if(pending[i].r===dragItem.r&&pending[i].c===dragItem.c)idx=i;if(idx<0)return;var t=state.board[dragItem.r][dragItem.c];state.board[dragItem.r][dragItem.c]=null;state.board[r][c]=t;pending[idx].r=r;pending[idx].c=c}dragItem=null;render();}
  function dropRack(e){if(waiting)return;e.preventDefault();if(!dragItem||dragItem.kind!=='board')return;for(var i=0;i<pending.length;i++)if(pending[i].r===dragItem.r&&pending[i].c===dragItem.c){state.players[state.turn].rack.push(pending[i].tile.blank?tile('?'):pending[i].tile);state.board[dragItem.r][dragItem.c]=null;pending.splice(i,1);break}dragItem=null;render();}
  function startGesture(e){if(waiting||selected>=0||state.board[Number(e.currentTarget.getAttribute('data-r'))][Number(e.currentTarget.getAttribute('data-c'))])return;gesture={r:Number(e.currentTarget.getAttribute('data-r')),c:Number(e.currentTarget.getAttribute('data-c'))}}
  function endGesture(e){if(waiting||!gesture)return;var r=Number(e.currentTarget.getAttribute('data-r')),c=Number(e.currentTarget.getAttribute('data-c'));if(r===gesture.r&&c!==gesture.c){anchor={r:gesture.r,c:gesture.c,d:'H'};suppressClick=true}else if(c===gesture.c&&r!==gesture.r){anchor={r:gesture.r,c:gesture.c,d:'V'};suppressClick=true}gesture=null;if(suppressClick){render();}}
  function undo(){
    if(waiting) return;
    for(var i=0;i<pending.length;i++){
      var x=pending[i];
      state.board[x.r][x.c]=null;
      state.players[state.turn].rack.push(x.tile.blank?tile('?'):x.tile);
    }
    pending=[];
    selected=-1;
    anchor=null;
    pendingWord=null;
    $('wordInput').value='';
    clearPrompt();
    render();
  }
  function line(r,c,dr,dc){var a=[];while(r-dr>=0&&r-dr<N&&c-dc>=0&&c-dc<N&&state.board[r-dr][c-dc]){r-=dr;c-=dc}while(r>=0&&r<N&&c>=0&&c<N&&state.board[r][c]){a.push({r:r,c:c,t:state.board[r][c]});r+=dr;c+=dc}return a}
  function isNew(r,c){for(var i=0;i<pending.length;i++)if(pending[i].r===r&&pending[i].c===c)return true;return false}
  function validate(){
    if(!pending.length)throw Error('Place at least one tile.');
    var rows={},cols={},i,x;for(i=0;i<pending.length;i++){rows[pending[i].r]=1;cols[pending[i].c]=1}
    if(Object.keys(rows).length>1&&Object.keys(cols).length>1)throw Error('New tiles must be in one row or column.');
    var hasExisting=false;for(var rr=0;rr<N;rr++) for(var cc=0;cc<N;cc++) if(state.board[rr][cc] &&!isNew(rr,cc)) hasExisting=true;
    if(!hasExisting){ if(!isNew(C,C)) throw Error('First move must cover the center.'); }
    else { var touches=false; for(i=0;i<pending.length;i++){x=pending[i]; if((state.board[x.r-1]&&state.board[x.r-1][x.c]&&!isNew(x.r-1,x.c))||(state.board[x.r+1]&&state.board[x.r+1][x.c]&&!isNew(x.r+1,x.c))||(state.board[x.r][x.c-1]&&!isNew(x.r,x.c-1))||(state.board[x.r][x.c+1]&&!isNew(x.r,x.c+1))) touches=true; } if(!touches) throw Error('Must connect to an existing tile.'); }
    var words=[],seen={};for(i=0;i<pending.length;i++){x=pending[i];[[0,1],[1,0]].forEach(function(d){var w=line(x.r,x.c,d[0],d[1]),key=w.map(function(y){return y.r+','+y.c}).join('|');if(w.length>1&&!seen[key]){seen[key]=1;words.push(w)}})}if(!words.length)throw Error('Must form at least two letters.');return words;
  }
  function score(w){var total=0,mult=1;for(var i=0;i<w.length;i++){var x=w[i],v=x.t.blank?0:V[x.t.l],p=isNew(x.r,x.c)?premium(x.r,x.c):'';if(p==='DL')v*=2;if(p==='TL')v*=3;if(p==='DW')mult*=2;if(p==='TW')mult*=3;total+=v}return total*mult}
  function snapshotForRollback(){
    return {
      board: JSON.parse(JSON.stringify(state.board)),
      players: JSON.parse(JSON.stringify(state.players)),
      bag: state.bag.slice(),
      history: state.history.slice(),
      moveCount: state.moveCount,
      turn: state.turn
    };
  }
  function encodeState(gs){try{return btoa(unescape(encodeURIComponent(JSON.stringify(gs))))}catch(e){return null}}
  function decodeState(b64){try{return JSON.parse(decodeURIComponent(escape(atob(b64))))}catch(e){return null}}
  function buildLink(gs){
    var b64=encodeState(gs);
    if(!b64) return null;
    return location.href.split('#')[0].split('?')[0]+'#s='+encodeURIComponent(b64);
  }
  function copyLink(gs){
    var link=buildLink(gs);
    if(!link){message('Could not create link');return null}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){
        message('Link copied! Send it to '+gs.players[gs.turn].name+' - pass it on.');
      }).catch(function(){
        prompt('Copy this link and send to opponent:',link);
      });
    }else{
      prompt('Copy this link and send to opponent:',link);
    }
    return link;
  }
  function tryLoadFromHash(){
    var h=location.hash||'';
    if(h.indexOf('#s=')===0){
      try{
        var b64=decodeURIComponent(h.slice(3));
        var gs=decodeState(b64);
        if(gs) return gs;
      }catch(e){}
    }
    try{
      var q=new URLSearchParams(location.search);
      var qs=q.get('s');
      if(qs){
        var gs2=decodeState(decodeURIComponent(qs));
        if(gs2) return gs2;
      }
    }catch(e){}
    return null;
  }
  function generateGameHTML(gs){
    var m='<script id="game-state" type="application/json">';
    var txt=JSON.stringify(gs).replace(/</g,'\\u003c');
    var src='<!doctype html>\n'+document.documentElement.outerHTML;
    var b=src.indexOf(m);
    var e=src.indexOf('<\/script>',b);
    if(b<0||e<0) return null;
    return src.slice(0,b+m.length)+txt+src.slice(e);
  }
  function downloadOpponentFile(gs){
    var opp=JSON.parse(JSON.stringify(gs));
    opp.turn=1;
    var html=generateGameHTML(opp);
    if(!html){message('Could not create file');return}
    copyLink(opp);
  }
  function commit(){
    try{
      var words=validate(),pts=0,nms=[];for(var i=0;i<words.length;i++){pts+=score(words[i]);nms.push(words[i].map(function(x){return x.t.l}).join(''));}if(pending.length===7)pts+=50;
      state.undoStack = state.undoStack || [];
      if(state.undoStack.length>0) state.undoStack.shift();
      state.undoStack.push(snapshotForRollback());
      var myIdx=state.turn; var p=state.players[myIdx]; p.score+=pts; state.history.push(p.name+': '+nms.join(' + ')+' for '+pts); state.moveCount=(state.moveCount||0)+1; draw(state,p); pending=[]; anchor=null; pendingWord=null;
      var myRack=p.rack.slice(); var oppName=state.players[1-myIdx].name;
      state.turn=1-state.turn;
      copyLink(state);
      $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+(i===state.turn?' - turn':'')+'</span><strong>'+x.score+'</strong></div>'}).join('');
      $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
      $('bag').textContent=state.bag.length+' tiles remain.';
      enterWaitingMode(myRack, oppName);
      message('Link copied! Send it to '+oppName+' - pass it on.');
    }catch(e){message(e.message);}
  }
  function pass(){
    if(pending.length) return message('Undo unplayed tiles before passing.');
    var myIdx=state.turn;
    var myRackPass=state.players[myIdx].rack.slice();
    var oppName=state.players[1-myIdx].name;
    var p=state.players[myIdx];
    state.undoStack = state.undoStack || [];
    if(state.undoStack.length>3) state.undoStack.shift();
    state.undoStack.push(snapshotForRollback());
    if(state.moveCount===0){
      if(confirm('Allow '+oppName+' to play the first word?')){
        state.history.push(p.name+' passed - '+oppName+' to start');
        state.moveCount=1;
        state.turn=1-state.turn;
        copyLink(state);
        $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+'</span><strong>'+x.score+'</strong></div>'}).join('');
        $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
        $('bag').textContent=state.bag.length+' tiles remain.';
        enterWaitingMode(myRackPass, oppName);
        message('You passed. '+oppName+' to start - opening link copied.');
      }
      return;
    }
    state.history.push(p.name+' passed');
    draw(state,p);
    state.moveCount=(state.moveCount||0)+1;
    state.turn=1-state.turn;
    anchor=null;
    copyLink(state);
    $('scores').innerHTML=state.players.map(function(x,i){return '<div class="score '+(i===state.turn?'active':'')+'"><span>'+esc(x.name)+(i===state.turn?' - turn':'')+'</span><strong>'+x.score+'</strong></div>'}).join('');
    $('history').innerHTML=state.history.slice().reverse().map(function(x){return'<li>'+esc(x)+'</li>'}).join('');
    $('bag').textContent=state.bag.length+' tiles remain.';
    enterWaitingMode(myRackPass, oppName);
    message('Link copied! Send it to '+oppName+' - pass it on.');
  }
  function startGame(){
    var a=$('nameA').value.replace(/[<>]/g,'').trim();
    var b=$('nameB').value.replace(/[<>]/g,'').trim();
    if(a.length<1 || b.length<1){alert('Enter both names');return;}
    if(a.toLowerCase()===b.toLowerCase()){alert('Use two different names.');return;}
    var init=fresh(a,b);
    $('setup').hidden=true;
    state=init;
    render();
    var opp=JSON.parse(JSON.stringify(init));
    opp.turn=1;
    var link=buildLink(opp);
    if(link && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(function(){
        message('Link copied! Share it with '+init.players[1].name+'. Decide with opponent who will play first.');
      }).catch(function(){
        prompt('Share this link with '+init.players[1].name+'. Decide with opponent who will play first:', link);
      });
    }else if(link){
      prompt('Share this link with '+init.players[1].name+'. Decide with opponent who will play first:', link);
      message('Share the link with '+init.players[1].name+'. Decide with opponent who will play first.');
    }else{
      downloadOpponentFile(init);
      message('File for '+init.players[1].name+'. Share it. Decide with opponent who will play first.');
    }
    $('placement').textContent='Link for '+init.players[1].name+' copied - decide who plays first';
  }
  function handleSetupKeyDown(e){if(e.key==='Enter'){e.preventDefault();startGame();}}
  $('submitWord').onclick=commit;$('undo').onclick=undo;$('pass').onclick=pass;
  $('playWord').onclick=playTyped;$('shuffle').onclick=shuffleRack;
  $('wordInput').onkeydown=function(e){if(e.key==='Enter'){if(waiting)return;e.preventDefault();playTyped()}};
  $('nameA').onclick=function(){this.select();};$('nameB').onclick=function(){this.select();};$('nameA').onkeydown=handleSetupKeyDown;$('nameB').onkeydown=handleSetupKeyDown;
  $('start').onclick=startGame;$('help').onclick=function(){alert('Type word + Enter. Add 8,8,0 across / 8,8,1 down in any order. Or word alone then click for across, double-click for down. Submit copies link - decide who plays first.')};
  try{state=JSON.parse($('game-state').textContent)}catch(e){state=null}
  var hs=tryLoadFromHash(); if(hs){state=hs}
  if(state){$('setup').hidden=true;render();}else{$('setup').hidden=false;$('nameA').focus();}
}());
</script>
